{% extends "base.html" %}
{% block title %}Log in · Webhook Gateway{% endblock %}
{% block content %}<section class="panel">
    <h1>Welcome back</h1>
    <p class="muted">Log in to view your webhook workspace.</p>
    <form method="post" action="{% url 'login' %}">{% csrf_token %}{{ loginform.as_p }}<button type="submit">Log
            in</button></form>
    <p class="form-help">New here? <a href="{% url 'register' %}">Create an account</a></p>
</section>{% endblock %}
